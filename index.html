<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
<style>
  :root {
    --font-sans: 'Inter', sans-serif;
    
    /* Color Palette for Task Statuses */
    --color-completed: #1a57c8; /* blue-500 */
    --color-completed-bg: #1a57c808; /* blue-50 */
    --color-in-progress: #22C55E; /* blue-500 */
    --color-in-progress-bg: #F0FDF4; /* blue-50 */
    --color-pending: #22C55E; /* orange-500 */
    --color-pending-bg: #F0FDF4; /* orange-50 */
    --color-overdue: #EF4444; /* red-500 */
    --color-overdue-bg: #FEF2F2; /* red-50 */
    --color-proximate: #8c8686; /* yellow-500 */
    --color-proximate-bg: #92908b13; /* yellow-50 */
  }
  body {
    font-family: var(--font-sans);
  }
  
  /* Estilos para el drag and drop táctil */
  .touch-drag-over {
    background-color: rgba(59, 130, 246, 0.1) !important;
    border: 2px solid rgba(59, 130, 246, 0.4) !important;
    transform: scale(1.02) !important;
    transition: all 0.2s ease !important;
  }

  /* Mejorar la experiencia táctil - usar touch-action para controlar el comportamiento */
  [data-task-id] {
    touch-action: pan-y; /* Permite scroll vertical pero previene otros gestos */
  }

  /* Feedback visual durante el arrastre táctil */
  .touch-dragging {
    opacity: 0.7 !important;
    transform: scale(1.05) !important;
    z-index: 1000 !important;
    pointer-events: none !important;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3) !important;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .animate-fade-in {
    animation: fadeIn 0.2s ease-out forwards;
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  .animate-scale-in {
    animation: scaleIn 0.2s ease-out forwards;
  }
  
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in-up {
    animation: fadeInUp 0.3s ease-out forwards;
  }
</style>
</head>
<body class="bg-gray-100 text-slate-800">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
